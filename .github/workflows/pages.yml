# Builds the site and publishes it with GitHub Pages.
#
# Every change committed to the main branch goes live automatically, about a
# minute later. You can also run it by hand from the Actions tab
# ("Publish site" → "Run workflow") if you ever need to force a rebuild.

name: Publish site

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

# If two commits land close together, let the newer one win rather than
# queueing up a stale deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # The published site lives under /<repository-name>/, not at the root,
      # so every link has to carry that prefix. Taken straight from the repo
      # name, which means renaming the repository keeps working with no edit
      # here. (actions/configure-pages used to do this, but it crashes with an
      # internal TypeError, and this is one line.)
      - name: Build site
        run: bundle exec jekyll build --baseurl "/${GITHUB_REPOSITORY#*/}"
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
