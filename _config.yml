# ---------------------------------------------------------------------------
# Site-wide settings. Change the title and tagline here and they update
# on every page at once.
# ---------------------------------------------------------------------------

title: Title
tagline: Tagline goes here.

# The two menu rows. To rename a tab, edit its "name" below — you no longer
# have to touch every page. (Changing "url" means also renaming the matching
# .md file.)

nav_topics:
  - name: Environmental
    url: /environmental.html
  - name: Social
    url: /social.html
  - name: Geopolitical
    url: /geopolitical.html
  - name: Safety
    url: /safety.html
  - name: Long Term
    url: /long-term.html

nav_site:
  - name: Sources
    url: /sources.html
  - name: Purpose
    url: /purpose.html
  - name: About Us
    url: /about.html

# ---------------------------------------------------------------------------
# Build settings — you shouldn't need to change these.
# ---------------------------------------------------------------------------

markdown: kramdown

plugins:
  - jekyll-relative-links

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - preview
  - publish
  - vendor
  - .obsidian
