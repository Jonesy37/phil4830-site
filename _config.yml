# ---------------------------------------------------------------------------
# Site-wide settings. Change the title and tagline here and they update
# on every page at once.
# ---------------------------------------------------------------------------

title: Title
tagline: Tagline goes here.

# The two menu rows. To rename a tab, edit its "name" below — you no longer
# have to touch every page. (Changing "url" means also renaming the matching
# .md file.)

nav_topics:
  - name: Environmental
    url: /environmental.html
  - name: Social
    url: /social.html
  - name: Geopolitical
    url: /geopolitical.html
  - name: Safety
    url: /safety.html
  - name: Long Term
    url: /long-term.html

nav_site:
  - name: Sources
    url: /sources.html
  - name: Purpose
    url: /purpose.html
  - name: About Us
    url: /about.html

# ---------------------------------------------------------------------------
# Build settings — you shouldn't need to change these.
# ---------------------------------------------------------------------------

markdown: kramdown

# The published site lives at jonesy37.github.io/phil4830-site/, so every
# link needs that prefix. ./preview overrides this to empty, which is why
# the local preview still works at plain http://localhost:4000.
baseurl: /phil4830-site

# The finished pages are written into docs/ and committed. GitHub serves
# that folder directly, with no build step on their side.
destination: docs

keep_files:
  - .nojekyll

plugins:
  - jekyll-relative-links

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - preview
  - publish
  - Publish.command
  - vendor
  - .obsidian
